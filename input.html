<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NF受付 記録システム</title>

  <!-- LINE・SNS共有用の表示設定（OGP） -->
  <meta property="og:title" content="NF受付 記録システム">
  <meta property="og:site_name" content="NF受付 記録システム">
  <meta property="og:description" content="NF受付の金額入力・集計システム">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ts780-crypto.github.io/nf-reception/">
  <meta property="og:image" content="https://ts780-crypto.github.io/nf-reception/apple-touch-icon.png">

  <!-- PCブラウザ・一部ブラウザ用 (SVG) -->
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">

  <!-- iPhone Safariの「タブ一覧画面」用 -->
  <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png?v=2">

  <!-- iPhone 「ホーム画面に追加」用 -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NF受付">

  <!-- Android (Chrome) 用 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
  
  <link rel="stylesheet" href="style.css?v=1">
 
</head>
<body ontouchstart="">
  
  <!-- パスワード認証画面（初期状態） -->
  <div id="authOverlay" class="auth-overlay">
    <div class="auth-card">
      <h3>パスワード認証</h3>
      <p style="font-size: 12px; color: var(--text-sub); margin: 0;">入力画面を開くにはパスワードを入力してください</p>
      
      <form onsubmit="authenticate(event)">
        <input type="password" id="passInput" placeholder="パスワードを入力" autocomplete="current-password">
        <button type="submit" class="btn-action" style="width: 100%; background: var(--primary); color: #ffffff; border: none; padding: 12px; font-size: 14px;">認証</button>
      </form>
      
      <p id="authError" style="color: var(--delete-text); font-size: 12px; margin: 10px 0 0 0; display: none;">パスワードが違います</p>
      <a href="index.html" class="header-nav-link" style="display: inline-block; margin-top: 16px;">← 集計画面に戻る</a>
    </div>
  </div>
  <!-- ヘッダー -->
  <div class="header-bar">
    <h2>NF受付 記録システム</h2>
    <a href="index.html" class="header-nav-link">← 集計画面</a>
  </div>

  <!-- ステータスバー -->
  <div class="status-bar">
    <div id="netStatus" class="net-badge online">
      <span class="status-dot"></span>
      <span id="netStatusText">オンライン</span>
    </div>
    <div id="syncInfo" class="sync-info">全データ同期完了</div>
  </div>

  <!-- 集計カード -->
  <div class="summary-box">
    <div class="summary-card">
      <div class="summary-label">売上件数</div>
      <div class="summary-value" id="totalCount">0 <span class="unit">件</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">合計金額</div>
      <div class="summary-value" id="totalAmount">0 <span class="unit">円</span></div>
    </div>
  </div>

  <!-- 担当者入力欄 -->
  <div class="user-box">
    <label for="userName">担当者名</label>
    <input type="text" id="userName" placeholder="担当者名を入力（自動保存）" oninput="localStorage.setItem('savedUserName', this.value)">
  </div>

  <!-- 金額ボタン設定ヘッダー -->
  <div class="btn-header">
    <span class="btn-header-title">金額ショートカット</span>
    <button type="button" class="btn-settings-toggle" onclick="toggleSettings()">金額変更</button>
  </div>

  <!-- 金額設定パネル（初期状態は非表示） -->
  <div id="settingsPanel" class="settings-panel" style="display: none;">
    <p class="settings-desc">ボタンの金額を変更できます（この端末のみ保存）</p>
    <div class="settings-inputs">
      <input type="number" id="preset1" placeholder="ボタン1">
      <input type="number" id="preset2" placeholder="ボタン2">
      <input type="number" id="preset3" placeholder="ボタン3">
      <input type="number" id="preset4" placeholder="ボタン4">
    </div>
    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <button type="button" class="btn-action" style="flex: 1;" onclick="resetPresets()">デフォルトに戻す</button>
      <button type="button" class="btn-action" style="flex: 1; background-color: var(--primary); color: #ffffff; border: none;" onclick="savePresets()">設定を保存</button>
    </div>
  </div>

  <!-- 金額ボタン（JavaScriptで動的描画） -->
  <div class="btn-grid" id="btnGrid"></div>

  <!-- 操作ボタン群 -->
  <div class="action-group">
    <button type="button" class="btn-action cancel" onclick="直近1件削除()">直近1件取消</button>
    <button type="button" class="btn-action" onclick="csvダウンロード()">CSV出力</button>
    <button type="button" class="btn-action delete" onclick="データ全削除()">全削除</button>
  </div>

  <!-- 記録履歴テーブル -->
  <h3>記録履歴</h3>
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>日時</th>
          <th>金額(円)</th>
          <th>担当者</th>
        </tr>
      </thead>
      <tbody id="logTableBody">
        <!-- JavaScriptで描画 -->
      </tbody>
    </table>
  </div>

  <script src="app.js"></script>
</body>
</html>
