<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NF受付 集計モニター</title>

  <!-- 1. LINE・SNS共有用の表示設定（OGP） -->
  <meta property="og:title" content="NF受付 集計モニター">
  <meta property="og:site_name" content="NF受付 記録システム">
  <meta property="og:description" content="NF受付のリアルタイム集計モニター">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ts780-crypto.github.io/nf-reception/viewer.html">
  <meta property="og:image" content="https://ts780-crypto.github.io/nf-reception/apple-touch-icon.png">

  <!-- 2. PCブラウザ・一部ブラウザ用 (SVG) -->
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">

  <!-- 3. iPhone Safariの「タブ一覧画面」用 (PNG形式) -->
  <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png?v=2">

  <!-- 4. iPhone 「ホーム画面に追加」用 -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NF集計">

  <!-- 5. Android (Chrome) 用 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">

  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>

  <!-- メインヘッダー -->
  <div class="header-bar">
    <h2>NF受付 集計モニター</h2>
    <a href="index.html" class="header-nav-link">← 入力画面</a>
  </div>

  <!-- サブステータスバー -->
  <div class="status-sub-bar">
    <div class="status-badge">
      <span class="status-dot"></span>
      リアルタイム同期中
    </div>
    <div class="last-update" id="lastUpdate">最終更新: --:--:--</div>
  </div>

  <main class="summary-grid" style="margin-bottom: 24px;">
    <!-- 売上件数 -->
    <div class="summary-card">
      <div class="label">売上件数</div>
      <div class="value" id="totalCount">0 <span class="unit">件</span></div>
    </div>

    <!-- 合計金額 -->
    <div class="summary-card">
      <div class="label">合計金額</div>
      <div class="value" id="totalAmount">0 <span class="unit">円</span></div>
    </div>
  </main>

  <!-- 記録履歴ヘッダー＆切替ボタン -->
  <div class="history-header">
    <h3 id="historyTitle">記録履歴（直近10件）</h3>
    <div class="toggle-group">
      <button type="button" id="btnLimit10" class="btn-toggle active" onclick="setDisplayMode('limit')">直近10件</button>
      <button type="button" id="btnLimitAll" class="btn-toggle" onclick="setDisplayMode('all')">全件</button>
    </div>
  </div>

  <!-- 記録履歴テーブル -->
  <div class="table-card">
    <table>
      <thead>
        <tr>
          <th>日時</th>
          <th>金額(円)</th>
          <th>担当者</th>
        </tr>
      </thead>
      <tbody id="logTableBody">
        <!-- JavaScriptで描画 -->
      </tbody>
    </table>
  </div>

  <script src="viewer.js"></script>

</body>
</html>
