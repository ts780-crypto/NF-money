<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NF受付 集計モニター</title>

  <!-- 1. LINE・SNS共有用の表示設定（OGP） -->
  <meta property="og:title" content="NF受付 集計モニター">
  <meta property="og:site_name" content="NF受付 記録システム">
  <meta property="og:description" content="NF受付のリアルタイム集計モニター">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ts780-crypto.github.io/nf-reception/viewer.html">
  <meta property="og:image" content="https://ts780-crypto.github.io/nf-reception/apple-touch-icon.png">

  <!-- 2. PCブラウザ・一部ブラウザ用 (SVG) -->
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">

  <!-- 3. iPhone Safariの「タブ一覧画面」用 (PNG形式) -->
  <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png?v=2">

  <!-- 4. iPhone 「ホーム画面に追加」用 -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NF集計">

  <!-- 5. Android (Chrome) 用 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">

  <link rel="stylesheet" href="style.css?v=1">
  
</head>
<body>

  <!-- メインヘッダー -->
  <div class="header-bar">
    <h2>NF受付 集計モニター</h2>
    <a href="index.html" class="header-nav-link">← 入力画面へ</a>
  </div>

  <!-- サブステータスバー -->
  <div class="status-sub-bar">
    <div class="status-badge">
      <span class="status-dot"></span>
      リアルタイム同期中
    </div>
    <div class="last-update" id="lastUpdate">最終更新: --:--:--</div>
  </div>

  <main class="summary-grid">
    <!-- 売上件数 -->
    <div class="summary-card">
      <div class="label">売上件数</div>
      <div class="value" id="totalCount">0 <span class="unit">件</span></div>
    </div>

    <!-- 合計金額 -->
    <div class="summary-card">
      <div class="label">合計金額</div>
      <div class="value" id="totalAmount">0 <span class="unit">円</span></div>
    </div>
  </main>

  <!-- Firebase SDK の読み込み -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- ★共通Firebase設定の読み込み -->
  <script src="firebase-config.js"></script>
  
  <script>
    // データベースの更新を常時監視
    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      let count = 0;
      let sum = 0;

      if (data) {
        const logs = Object.values(data);
        count = logs.length;
        sum = logs.reduce((total, item) => total + Number(item.amount || 0), 0);
      }

      // 数値表示の更新
      document.getElementById('totalCount').innerHTML = `${count} <span class="unit">件</span>`;
      document.getElementById('totalAmount').innerHTML = `${sum.toLocaleString()} <span class="unit">円</span>`;

      // 最終受信日時の更新
      const now = new Date();
      const timeStr = String(now.getHours()).padStart(2, '0') + ':' +
                      String(now.getMinutes()).padStart(2, '0') + ':' +
                      String(now.getSeconds()).padStart(2, '0');
      document.getElementById('lastUpdate').textContent = `最終更新: ${timeStr}`;
    });
  </script>

</body>
</html>
