<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NF受付 集計モニター</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    /* 暖色系カラー変数（ライトモード） */
    :root {
      --bg-color: #faf6f0;
      --card-bg: #ffffff;
      --text-main: #292524;
      --text-sub: #57534e;
      --link-color: #ea580c;
      --border: #e7e5e4;
      --status-bg: #dcfce7;
      --status-text: #15803d;
    }

    /* 暖色系カラー変数（ダークモード） */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1c1917;
        --card-bg: #292524;
        --text-main: #f5f5f4;
        --text-sub: #a8a29e;
        --link-color: #fb923c;
        --border: #44403c;
        --status-bg: #064e3b;
        --status-text: #4ade80;
      }
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 24px 16px;
      max-width: 420px;
      margin: 0 auto;
      background-color: var(--bg-color);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s, color 0.3s;
    }

    /* ヘッダーバー */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .header-bar h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      letter-spacing: -0.02em;
    }
    .header-nav-link {
      font-size: 13px;
      font-weight: 600;
      color: var(--link-color);
      text-decoration: none;
      padding: 6px 12px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: opacity 0.2s, background-color 0.3s;
      white-space: nowrap;
    }
    .header-nav-link:active {
      opacity: 0.7;
    }

    /* ステータス＆更新日時バー */
    .status-sub-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 20px;
      background-color: var(--status-bg);
      color: var(--status-text);
      font-size: 11px;
      font-weight: 600;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: currentColor;
    }
    .last-update {
      font-size: 12px;
      color: var(--text-sub);
    }

    /* 大型集計カード */
    .summary-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .summary-card {
      background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      color: #ffffff;
      box-shadow: 0 10px 20px -3px rgba(234, 88, 12, 0.3);
    }

    .summary-card .label {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 0.05em;
    }

    .summary-card .value {
      font-size: 42px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .summary-card .unit {
      font-size: 18px;
      font-weight: 600;
      opacity: 0.9;
      margin-left: 4px;
    }
  </style>
</head>
<body>

  <!-- メインヘッダー -->
  <div class="header-bar">
    <h2>NF受付 集計モニター</h2>
    <a href="index.html" class="header-nav-link">← 入力画面へ</a>
  </div>

  <!-- サブステータスバー -->
  <div class="status-sub-bar">
    <div class="status-badge">
      <span class="status-dot"></span>
      リアルタイム同期中
    </div>
    <div class="last-update" id="lastUpdate">最終更新: --:--:--</div>
  </div>

  <main class="summary-grid">
    <!-- 売上件数 -->
    <div class="summary-card">
      <div class="label">売上件数</div>
      <div class="value" id="totalCount">0 <span class="unit">件</span></div>
    </div>

    <!-- 合計金額 -->
    <div class="summary-card">
      <div class="label">合計金額</div>
      <div class="value" id="totalAmount">0 <span class="unit">円</span></div>
    </div>
  </main>

  <!-- Firebase SDK の読み込み -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCXcHT4dFy4w_hVwhGk4WOcQujduJYusZ4",
      authDomain: "nf-reception.firebaseapp.com",
      databaseURL: "https://nf-reception-default-rtdb.asia-southeast1.firebasedatabase.app/",
      projectId: "nf-reception",
      storageBucket: "nf-reception.firebasestorage.app",
      messagingSenderId: "64440957261",
      appId: "1:64440957261:web:ea0de56a0b7cf0ede8df04"
    };

    // Firebaseの初期化
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();
    const dbRef = database.ref('moneyLogs');

    // データベースの更新を常時監視
    dbRef.on('value', (snapshot) => {
      const data = snapshot.val();
      let count = 0;
      let sum = 0;

      if (data) {
        const logs = Object.values(data);
        count = logs.length;
        sum = logs.reduce((total, item) => total + Number(item.amount || 0), 0);
      }

      // 数値表示の更新
      document.getElementById('totalCount').innerHTML = `${count} <span class="unit">件</span>`;
      document.getElementById('totalAmount').innerHTML = `${sum.toLocaleString()} <span class="unit">円</span>`;

      // 最終受信日時の更新
      const now = new Date();
      const timeStr = String(now.getHours()).padStart(2, '0') + ':' +
                      String(now.getMinutes()).padStart(2, '0') + ':' +
                      String(now.getSeconds()).padStart(2, '0');
      document.getElementById('lastUpdate').textContent = `最終更新: ${timeStr}`;
    });
  </script>

</body>
</html>
