<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NF受付 記録システム</title>

  <!-- LINE・SNS共有用の表示設定（OGP） -->
  <meta property="og:title" content="NF受付 記録システム">
  <meta property="og:site_name" content="NF受付 記録システム">
  <meta property="og:description" content="NF受付の金額入力・集計システム">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ts780-crypto.github.io/nf-reception/">
  <meta property="og:image" content="https://ts780-crypto.github.io/nf-reception/apple-touch-icon.png">

  <!-- PCブラウザ・一部ブラウザ用 (SVG) -->
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">

  <!-- iPhone Safariの「タブ一覧画面」用 -->
  <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png?v=2">

  <!-- iPhone 「ホーム画面に追加」用 -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NF受付">

  <!-- Android (Chrome) 用 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
  
  <link rel="stylesheet" href="style.css?v=1">
 
</head>
<body ontouchstart="">

  <!-- ヘッダーエリア -->
  <div class="header-bar">
    <h2>NF受付 記録システム</h2>
    <a href="viewer.html" class="header-nav-link">閲覧画面へ ↗</a>
  </div>

  <!-- ネットワーク＆同期ステータス -->
  <div class="status-bar">
    <div id="netStatus" class="net-badge online">
      <span class="status-dot"></span>
      <span id="netStatusText">オンライン</span>
    </div>
    <div class="sync-info" id="syncInfo">全データ同期完了</div>
  </div>

  <!-- 担当者入力欄 -->
  <div class="user-box">
    <label for="userName">担当者名 ※個人情報は入力しないでください</label>
    <input type="text" id="userName" placeholder="例: 山田" onchange="localStorage.setItem('savedUserName', this.value)">
  </div>

  <!-- 集計表示エリア -->
  <div class="summary-box">
    <div class="summary-card">
      <div class="summary-label">売上件数</div>
      <div class="summary-value" id="totalCount">0 <span class="unit">件</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">合計金額</div>
      <div class="summary-value" id="totalAmount">0 <span class="unit">円</span></div>
    </div>
  </div>

  <!-- 金額ボタン -->
  <div class="btn-grid">
    <button class="btn-input" onclick="記録(250)">250<span class="btn-unit">円</span></button>
    <button class="btn-input" onclick="記録(200)">200<span class="btn-unit">円</span></button>
    <button class="btn-input" onclick="記録(150)">150<span class="btn-unit">円</span></button>
    <button class="btn-input" onclick="記録(100)">100<span class="btn-unit">円</span></button>
  </div>

  <!-- 操作用ボタン -->
  <div class="action-group">
    <button class="btn-action" onclick="csvダウンロード()">CSV出力</button>
    <button class="btn-action cancel" onclick="直近1件削除()">1件取消</button>
    <button class="btn-action delete" onclick="データ全削除()">全消去</button>
  </div>

  <!-- 共有記録一覧 -->
  <h3>共有記録一覧</h3>
  <div class="table-card">
    <table>
      <thead>
        <tr><th>日時</th><th>金額</th><th>担当</th></tr>
      </thead>
      <tbody id="logTableBody"></tbody>
    </table>
  </div>

  <!-- Firebase SDK の読み込み -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <!-- ★共通Firebase設定の読み込み -->
  <script src="firebase-config.js"></script>
  
  <script>
    let remoteLogs = [];   // Firebaseから同期されたデータ
    let pendingLogs = [];  // ローカル（localStorage）にある未送信データ

    window.onload = function() {
      // サービスワーカー登録（オフライン時のページ再読み込み用）
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Error:', err));
      }

      // 保存された担当者名の読み込み
      const savedName = localStorage.getItem('savedUserName');
      if (savedName) document.getElementById('userName').value = savedName;

      // ローカルの未送信データを読み込み
      loadPendingLogs();

      // ネットワーク状態の監視
      window.addEventListener('online', updateNetworkStatus);
      window.addEventListener('offline', updateNetworkStatus);
      updateNetworkStatus();

      // Firebaseデータリアルタイム監視
      dbRef.on('value', (snapshot) => {
        const data = snapshot.val();
        remoteLogs = [];
        if (data) {
          remoteLogs = Object.keys(data).map(key => ({
            key: key,
            ...data[key]
          }));
        }
        renderData();
      });
    };

    // --- ローカルキュー（localStorage）の操作 ---
    function loadPendingLogs() {
      const stored = localStorage.getItem('nf_pending_logs');
      pendingLogs = stored ? JSON.parse(stored) : [];
    }

    function savePendingLogs() {
      localStorage.setItem('nf_pending_logs', JSON.stringify(pendingLogs));
    }

    // --- ネットワーク状態＆自動同期処理 ---
    function updateNetworkStatus() {
      const statusBadge = document.getElementById('netStatus');
      const statusText = document.getElementById('netStatusText');

      if (navigator.onLine) {
        statusBadge.className = "net-badge online";
        statusText.textContent = "オンライン";
        syncPendingLogs();
      } else {
        statusBadge.className = "net-badge offline";
        statusText.textContent = "オフライン";
      }
      renderData();
    }

    // 未送信データを一括送信
    async function syncPendingLogs() {
      if (!navigator.onLine || pendingLogs.length === 0) return;

      const itemsToSync = [...pendingLogs];
      for (const item of itemsToSync) {
        try {
          await dbRef.push({
            id: item.id, // ★固有IDを含めて送信することで二重カウントを防止
            date: item.date,
            amount: item.amount,
            user: item.user,
            timestamp: item.timestamp || firebase.database.ServerValue.TIMESTAMP
          });
          // 送信成功したものをローカルから除去
          pendingLogs = pendingLogs.filter(p => p.id !== item.id);
          savePendingLogs();
        } catch (err) {
          console.error("送信エラー:", err);
          break;
        }
      }
      renderData();
    }

    // --- 記録処理 ---
    function 記録(金額) {
      const userName = document.getElementById('userName').value || "未設定";
      const now = new Date();
      const dateStr = now.getFullYear() + '/' +
        String(now.getMonth() + 1).padStart(2, '0') + '/' +
        String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');

      const logItem = {
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 5),
        date: dateStr,
        amount: 金額,
        user: userName,
        timestamp: Date.now()
      };

      // 1. まずローカル配列＆localStorageに保存
      pendingLogs.push(logItem);
      savePendingLogs();
      renderData();

      // 2. オンラインなら直ちに同期試行
      if (navigator.onLine) {
        syncPendingLogs();
      }
    }

    // --- 画面レンダリング ---
    function renderData() {
      const tbody = document.getElementById('logTableBody');
      tbody.innerHTML = '';

      // Firebase上に既に存在するIDを取得
      const remoteIds = new Set(remoteLogs.map(r => r.id).filter(Boolean));

      // Firebaseにまだ届いていない未送信データのみを抽出（ここで二重集計を防ぐ）
      const activePendingLogs = pendingLogs.filter(p => !remoteIds.has(p.id));

      // Firebase上のデータ と 未送信データを統合
      const allLogs = [...remoteLogs, ...activePendingLogs.map(p => ({ ...p, isPending: true }))];

      const count = allLogs.length;
      const sum = allLogs.reduce((total, item) => total + Number(item.amount || 0), 0);

      // 画面更新
      document.getElementById('totalCount').innerHTML = `${count} <span class="unit">件</span>`;
      document.getElementById('totalAmount').innerHTML = `${sum.toLocaleString()} <span class="unit">円</span>`;

      const syncInfo = document.getElementById('syncInfo');
      if (activePendingLogs.length > 0) {
        syncInfo.textContent = `未送信: ${activePendingLogs.length}件`;
        syncInfo.style.color = 'var(--cancel-text)';
      } else {
        syncInfo.textContent = "全データ同期完了";
        syncInfo.style.color = 'var(--text-sub)';
      }

      // テーブル出力（新しい順）
      allLogs.slice().reverse().forEach(item => {
        const row = tbody.insertRow();
        row.insertCell(0).textContent = item.date;
        row.insertCell(1).textContent = item.amount;
        
        const userCell = row.insertCell(2);
        userCell.textContent = item.user || "未設定";
        if (item.isPending) {
          const tag = document.createElement('span');
          tag.className = 'pending-tag';
          tag.textContent = '未送信';
          userCell.appendChild(tag);
        }
      });
    }

    // --- 操作機能 ---
    function 直近1件削除() {
      const remoteIds = new Set(remoteLogs.map(r => r.id).filter(Boolean));
      const activePendingLogs = pendingLogs.filter(p => !remoteIds.has(p.id));

      // 未送信（ローカル）の最新データがあればそれを削除
      if (activePendingLogs.length > 0) {
        const lastPending = activePendingLogs[activePendingLogs.length - 1];
        if (confirm(`【未送信データ】直近の記録を取り消しますか？\n・金額: ${lastPending.amount}円`)) {
          pendingLogs = pendingLogs.filter(p => p.id !== lastPending.id);
          savePendingLogs();
          renderData();
        }
        return;
      }

      // Firebase上の最新データを削除
      if (remoteLogs.length > 0) {
        const lastLog = remoteLogs[remoteLogs.length - 1];
        if (confirm(`直近の記録を取り消しますか？\n・日時: ${lastLog.date}\n・金額: ${lastLog.amount}円`)) {
          dbRef.child(lastLog.key).remove();
        }
        return;
      }

      alert('削除するデータがありません');
    }

    function csvダウンロード() {
      const remoteIds = new Set(remoteLogs.map(r => r.id).filter(Boolean));
      const activePendingLogs = pendingLogs.filter(p => !remoteIds.has(p.id));
      const allLogs = [...remoteLogs, ...activePendingLogs];

      if (allLogs.length === 0) {
        alert('データがありません');
        return;
      }

      let csvContent = '\uFEFF日時,金額,担当者,ステータス\n';
      allLogs.forEach(item => {
        const status = activePendingLogs.some(p => p.id === item.id) ? '未送信' : '同期済';
        csvContent += `"${item.date}",${item.amount},"${item.user || ''}","${status}"\n`;
      });

      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = '共有金額記録.csv';
      a.click();
      URL.revokeObjectURL(url);
    }

    function データ全削除() {
      if (confirm('全員の共有記録およびローカルの未送信データをすべて削除しますか？\n※元に戻せません')) {
        pendingLogs = [];
        savePendingLogs();
        dbRef.remove();
      }
    }
  </script>

</body>
</html>
