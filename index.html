<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NF受付 記録システム</title>

  <!-- LINE・SNS共有用の表示設定（OGP） -->
  <meta property="og:title" content="NF受付 記録システム">
  <meta property="og:site_name" content="NF受付 記録システム">
  <meta property="og:description" content="NF受付の金額入力・集計システム">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://ts780-crypto.github.io/nf-reception/">
  <meta property="og:image" content="https://ts780-crypto.github.io/nf-reception/apple-touch-icon.png">

  <!-- PCブラウザ・一部ブラウザ用 (SVG) -->
  <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">

  <!-- iPhone Safariの「タブ一覧画面」用 -->
  <link rel="icon" type="image/png" sizes="180x180" href="apple-touch-icon.png?v=2">

  <!-- iPhone 「ホーム画面に追加」用 -->
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NF受付">

  <!-- Android (Chrome) 用 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#ea580c">
  
  <link rel="stylesheet" href="style.css?v=1">
 
</head>
<body ontouchstart="">

  <!-- ヘッダーエリア -->
  <div class="header-bar">
    <h2>NF受付 記録システム</h2>
    <a href="viewer.html" class="header-nav-link">閲覧画面へ ↗</a>
  </div>

  <!-- ネットワーク＆同期ステータス -->
  <div class="status-bar">
    <div id="netStatus" class="net-badge online">
      <span class="status-dot"></span>
      <span id="netStatusText">オンライン</span>
    </div>
    <div class="sync-info" id="syncInfo">全データ同期完了</div>
  </div>

  <!-- 担当者入力欄 -->
  <div class="user-box">
    <label for="userName">担当者名 ※個人情報は入力しないでください</label>
    <input type="text" id="userName" placeholder="例: 山田" onchange="localStorage.setItem('savedUserName', this.value)">
  </div>

  <!-- 集計表示エリア -->
  <div class="summary-box">
    <div class="summary-card">
      <div class="summary-label">売上件数</div>
      <div class="summary-value" id="totalCount">0 <span class="unit">件</span></div>
    </div>
    <div class="summary-card">
      <div class="summary-label">合計金額</div>
      <div class="summary-value" id="totalAmount">0 <span class="unit">円</span></div>
    </div>
  </div>

  <!-- 金額ボタン設定ヘッダー -->
  <div class="btn-header">
    <span class="btn-header-title">金額ショートカット</span>
    <button type="button" class="btn-settings-toggle" onclick="toggleSettings()">⚙️ 金額変更</button>
  </div>

  <!-- 金額設定パネル -->
  <div id="settingsPanel" class="settings-panel" style="display: none;">
    <p class="settings-desc">ボタンの金額を変更できます（この端末のみ保存）</p>
    <div class="settings-inputs">
      <input type="number" id="preset1" placeholder="ボタン1">
      <input type="number" id="preset2" placeholder="ボタン2">
      <input type="number" id="preset3" placeholder="ボタン3">
      <input type="number" id="preset4" placeholder="ボタン4">
    </div>
    <div style="display: flex; gap: 8px; margin-top: 10px;">
      <button type="button" class="btn-action" style="flex: 1;" onclick="resetPresets()">デフォルトに戻す</button>
      <button type="button" class="btn-action" style="flex: 1; background-color: var(--primary); color: #ffffff; border: none;" onclick="savePresets()">設定を保存</button>
    </div>
  </div>

  <!-- 金額ボタン（JavaScriptで自動出力されます） -->
  <div class="btn-grid" id="btnGrid"></div>

  <!-- 操作用ボタン -->
  <div class="action-group">
    <button class="btn-action" onclick="csvダウンロード()">CSV出力</button>
    <button class="btn-action cancel" onclick="直近1件削除()">1件取消</button>
    <button class="btn-action delete" onclick="データ全削除()">全消去</button>
  </div>

  <!-- 共有記録一覧 -->
  <h3>共有記録一覧</h3>
  <div class="table-card">
    <table>
      <thead>
        <tr><th>日時</th><th>金額</th><th>担当</th></tr>
      </thead>
      <tbody id="logTableBody"></tbody>
    </table>
  </div>

  <script src="app.js"></script>

</body>
</html>
