<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="nf-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;" />
      <stop offset="100%" style="stop-color:#ea580c;" />
    </linearGradient>
  </defs>
  <!-- 背景：余白・角丸なしで画面いっぱいに広げる（OSが自動で角丸に切ってくれます） -->
  <rect x="0" y="0" width="400" height="400" fill="url(#nf-orange)" />
  
  <!-- チケットモチーフ（拡大） -->
  <path d="M110 85 h180 a25 25 0 0 1 25 25 v35 a20 20 0 0 0 0 40 v35 a25 25 0 0 1 -25 25 h-180 a25 25 0 0 1 -25 -25 v-35 a20 20 0 0 0 0 -40 v-35 a25 25 0 0 1 25 -25 Z" fill="#faf6f0" opacity="0.15"/>
  
  <!-- NF 太文字（拡大） -->
  <text x="200" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="140" fill="#ffffff" text-anchor="middle" letter-spacing="-4">NF</text>
  
  <!-- 受付 ピル型タグ（拡大） -->
  <rect x="85" y="255" width="230" height="68" rx="34" fill="#faf6f0" />
  <text x="200" y="302" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="34" fill="#ea580c" text-anchor="middle" letter-spacing="5">受付</text>
</svg>
